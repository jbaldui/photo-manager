[project]
name = "photo-manager"
version = "0.1.0"
description = "Local photo manager: metadata browser and multi-method similarity grouping"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "rawpy>=0.22",
  "imagehash>=4.3",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "faiss-cpu>=1.8",
  "torch>=2.4",
  "torchvision>=0.19",
  "open_clip_torch>=2.26",
  "rapidocr>=3",
  "onnxruntime>=1.31.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
